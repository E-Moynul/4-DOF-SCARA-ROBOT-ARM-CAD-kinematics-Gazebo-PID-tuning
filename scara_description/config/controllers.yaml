controller_manager:
  ros__parameters:
    update_rate: 1000
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint3_z
      - joint4
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0
    gains:
      joint_1:  {p: 1.0,   i: 0.0, d: 0.3,    i_clamp: 0.0}
      joint_2:  {p: 0.5,   i: 0.0, d: 0.15,   i_clamp: 0.0}
      joint3_z: {p: 200.0, i: 20.0, d: 20.0,  i_clamp: 5.0}
      joint4:   {p: 0.01,  i: 0.0, d: 0.0005, i_clamp: 0.0}